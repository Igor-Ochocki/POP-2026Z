454.5376,859.6094 L1454.5376,868.6094 A1,1 0 0 0 1455.5376,869.6094 L1464.5376,869.6094 L1454.5376,859.6094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="224.7134" x="882" y="878.1045">Mapowanie scenariusza PU2 (g&#322;&#243;wny):</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="334.1787" x="882" y="894.4561">1. utworzenie rezerwacji dla terminu -&gt; create_reservation</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="461.6396" x="892.8354" y="910.8076">(status UNPAID, termin zajmowany atomowo: UPDATE ... WHERE is_available,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="225.0879" x="892.8354" y="927.1592">r&#243;wnoczesna druga rezerwacja -&gt; 409)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="472.2085" x="882" y="943.5107">2. pro&#347;ba o potwierdzenie (z opcj&#261; cofni&#281;cia) -&gt; cancel_reservation zwalnia termin</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="492.1084" x="882" y="959.8623">3. potwierdzenie -&gt; wymaganie p&#322;atno&#347;ci (total_cost = base_price * participant_count)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="567.5376" x="882" y="976.2139">4. p&#322;atno&#347;&#263; -&gt; mark_payment_completed: PaymentService.process_payment, status CONFIRMED</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="453.4131" x="882" y="992.5654">5. potwierdzenie rezerwacji -&gt; MessageService.send_reservation_confirmation</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="217.4644" x="892.8354" y="1008.917">(wiadomo&#347;&#263; w skrzynce organizatora)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="401.0068" x="882" y="1025.2686">Anulowanie i p&#322;atno&#347;&#263; tylko przez w&#322;a&#347;ciciela rezerwacji (inaczej 403).</text></g><g class="entity" data-qualified-name="GMN44" data-source-line="175" id="ent0045"><path d="M1211,83.1094 L1211,131.1094 L1184.78,135.1094 L1211,139.1094 L1211,187.2188 A2,2 0 0 0 1213,189.2188 L1573.9097,189.2188 A2,2 0 0 0 1575.9097,187.2188 L1575.9097,91.1094 L1565.9097,81.1094 L1213,81.1094 A2,2 0 0 0 1211,83.1094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1565.9097,81.1094 L1565.9097,90.1094 A1,1 0 0 0 1566.9097,91.1094 L1575.9097,91.1094 L1565.9097,81.1094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="256.5024" x="1217" y="99.6045">B&#322;&#281;dy (wsp&#243;lne AppError z core/exceptions):</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="174.8398" x="1217" y="115.9561">404 - brak terminu / rezerwacji</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="214.627" x="1217" y="132.3076">403 - rezerwacja innego organizatora</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="307.1123" x="1217" y="148.6592">409 - termin zaj&#281;ty, rezerwacja op&#322;acona / anulowana</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="343.9097" x="1217" y="165.0107">400 - termin innej gry, liczba uczestnik&#243;w poza min-max gry</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="334.4961" x="1217" y="181.3623">user_id - parametr query do czasu JWT (jak w GamesApi)</text></g><g class="entity" data-qualified-name="GMN47" data-source-line="